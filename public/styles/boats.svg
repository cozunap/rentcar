<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Soft-blue circle backdrop identical to AutoTrader profiles -->
  <circle cx="85" cy="48" r="42" fill="#edf4fd"/>
  
  <!-- Marine Wave/Anchor small badge -->
  <circle cx="38" cy="32" r="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <path d="M35 34 Q38 31 41 34 Q44 37 47 34" stroke="#0284c7" stroke-width="1.75" fill="none" stroke-linecap="round"/>

  <!-- Water Surface Waves -->
  <path d="M12 73 C25 71 35 75 50 73 C65 71 75 75 90 73 C105 71 115 75 130 73 C145 71 155 75 170 73 C180 71 188 74 192 73" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Boat Hull (White with crisp slate contours) -->
  <path d="M22 62 L45 60 L75 58 L110 52 L145 52 L172 56 L188 64 L180 72 L26 72 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Sleek Blue Stripe on Hull -->
  <path d="M30 65 L175 65 L172 68 L28 68 Z" fill="#0284c7" opacity="0.85"/>

  <!-- Tinted Marine Windshield & Cockpit -->
  <path d="M85 58 L108 44 L142 44 L138 52 L85 58 Z" fill="#0f172a" opacity="0.85"/>
  
  <!-- Wakeboard Tower & Bimini Top Frame -->
  <path d="M96 58 L108 34 L136 34 L126 52" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="104" y1="34" x2="140" y2="34" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Outboard / SternDrive Motor Propeller Housing -->
  <rect x="18" y="60" width="8" height="15" rx="2" fill="#1e293b"/>
  <path d="M14 70 L20 70 L18 76 L12 76 Z" fill="#475569"/>

  <!-- Stainless Steel Bow Handrails -->
  <line x1="145" y1="52" x2="175" y2="56" stroke="#94a3b8" stroke-width="1.5"/>
</svg>